<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You Heart</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:#060202;
    overflow:hidden;
  }
  canvas{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const WORD = "i love you";

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildHeartLabels();
    buildChains();
  }

  function insideHeart(x, y){
    const X = x/12, Y = -y/12 + 0.4;
    const val = Math.pow(X*X + Y*Y - 1, 3) - X*X*Y*Y*Y;
    return val <= 0;
  }

  function heartOutline(t){
    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    return {x, y};
  }

  let heartLabels = [];
  function buildHeartLabels(){
    heartLabels = [];
    const cols = 28, rows = 28;
    for(let i=0;i<cols;i++){
      for(let j=0;j<rows;j++){
        const x = -18 + (36*i/cols) + (Math.random()-0.5)*1.1;
        const y = -18 + (33*j/rows) + (Math.random()-0.5)*1.1;
        if(insideHeart(x,y) && Math.random() < 0.85){
          heartLabels.push({
            x, y,
            size: Math.random()*0.55+0.55,
            alpha: Math.random()*0.5+0.35,
            flickerSpeed: Math.random()*1.5+0.4,
            flickerPhase: Math.random()*Math.PI*2,
            rot: (Math.random()-0.5)*0.2
          });
        }
      }
    }
  }

  let chains = [];
  function buildChains(){
    chains = [];
    const numChains = 5;
    for(let c=0; c<numChains; c++){
      const beadsInChain = 9;
      const expand = 1.25 + c*0.22;
      const speed = 0.09 + c*0.015;
      const dir = c % 2 === 0 ? 1 : -1;
      const phaseOffset = (c/numChains) * Math.PI*2;
      const beads = [];
      for(let b=0; b<beadsInChain; b++){
        beads.push({
          tOffset: (b/beadsInChain) * Math.PI*2 * 0.28,
          size: Math.random()*0.35+0.55,
          alphaBase: 0.35 + (b/beadsInChain)*0.5
        });
      }
      chains.push({ expand, speed, dir, phaseOffset, beads });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  let startTime = performance.now();

  function draw(now){
    const t = (now-startTime)/1000;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#060202';
    ctx.fillRect(0,0,W,H);

    const cx = W/2, cy = H/2;
    const scale = Math.min(W,H)*0.038;

    const glowR = Math.min(W,H)*0.55;
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
    grad.addColorStop(0,'rgba(255,30,30,0.16)');
    grad.addColorStop(1,'rgba(255,30,30,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx,cy,glowR,0,Math.PI*2);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for(const l of heartLabels){
      const flick = 0.55+0.45*Math.sin(t*l.flickerSpeed+l.flickerPhase);
      const px = cx + l.x*scale;
      const py = cy + l.y*scale;
      const fontSize = scale*0.62*l.size;
      const alpha = l.alpha*flick;
      const brightness = Math.floor(90+flick*130);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(l.rot);
      ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;
      ctx.shadowColor = `rgba(255,${Math.floor(40+flick*60)},${Math.floor(40+flick*40)},0.9)`;
      ctx.shadowBlur = 6+flick*8;
      ctx.fillStyle = `rgba(255,${brightness*0.35},${brightness*0.25},${alpha})`;
      ctx.fillText(WORD, 0, 0);
      ctx.restore();
    }

    for(const chain of chains){
      for(const bead of chain.beads){
        const tt = chain.phaseOffset + chain.dir*(t*chain.speed) + bead.tOffset;
        const pt = heartOutline(tt % (Math.PI*2));
        const px = cx + pt.x*scale*chain.expand;
        const py = cy + pt.y*scale*chain.expand;

        const flick = 0.6+0.4*Math.sin(t*2 + bead.tOffset*10);
        const fontSize = scale*0.5*bead.size;
        const alpha = bead.alphaBase*flick;

        ctx.save();
        ctx.translate(px, py);
        ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;
        ctx.shadowColor = `rgba(255,90,90,0.9)`;
        ctx.shadowBlur = 8;
        ctx.fillStyle = `rgba(255,${Math.floor(120+flick*90)},${Math.floor(110+flick*60)},${alpha})`;
        ctx.fillText(WORD, 0, 0);
        ctx.restore();
      }
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
